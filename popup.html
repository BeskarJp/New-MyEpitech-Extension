<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 220px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #1a1a1a;
            color: #eeeeee;
            margin: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .header img {
            width: 24px;
            height: 24px;
        }
        .header h1 {
            font-size: 14px;
            margin: 0;
            color: #4dabf7;
        }
        .status {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #51cf66; /* Vert */
            margin-bottom: 10px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #51cf66;
            border-radius: 50%;
            margin-right: 6px;
        }
        p {
            font-size: 11px;
            line-height: 1.4;
            color: #aaaaaa;
            margin: 0;
        }
        .footer {
            margin-top: 12px;
            font-size: 9px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icon.png" alt="logo">
        <h1>MyEpitech-Extension</h1>
    </div>
    <div class="status">
        <div class="dot"></div>
        <span>Extension is active</span>
    </div>
    <p>The percentage is automatically addapted on my.epitech.eu</p>
    <div class="footer">Version 1.2</div>
</body>

</html>
